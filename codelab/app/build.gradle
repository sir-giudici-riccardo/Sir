plugins {
    id "com.android.application"
}

android {
    namespace "org.sigma.codelab"
    compileSdk 35

    defaultConfig {
        applicationId "org.sigma.codelab"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Deliberately empty: Android framework APIs only.
}
