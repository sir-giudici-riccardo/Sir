plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("CODELAB_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("CODELAB_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("CODELAB_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CODELAB_KEY_PASSWORD")

android {
    namespace "org.sigma.codelab"
    compileSdk 35

    defaultConfig {
        applicationId "org.sigma.codelab"
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName "0.4.0"
    }

    signingConfigs {
        if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Deliberately empty: Android framework APIs only.
}
