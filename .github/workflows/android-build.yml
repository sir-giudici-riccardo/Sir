name: SIGMA Mobile Probe Android Build

on:
  push:
    branches:
      - sigma/mobile-arm-r1-circleci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Pure JVM regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_jvm_tests.sh

      - name: Offline-by-design source audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_manifest.py
          python3 scripts/audit_source.py

      - name: Assemble debug APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK permission and hash audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/github-actions
          APK="source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee receipts/github-actions/APK_SHA256.txt
          AAPT2="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$AAPT2"
          "$AAPT2" dump permissions "$APK" | tee receipts/github-actions/APK_PERMISSIONS.txt
          if grep -q 'uses-permission' receipts/github-actions/APK_PERMISSIONS.txt; then
            echo "Unexpected APK permission declaration" >&2
            exit 1
          fi

      - name: Upload APK and receipts
        uses: actions/upload-artifact@v4
        with:
          name: sigma-mobile-probe-debug
          if-no-files-found: error
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            receipts/github-actions/APK_SHA256.txt
            receipts/github-actions/APK_PERMISSIONS.txt
